<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summary</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Roboto:wght@400&display=swap" rel="stylesheet">
    <style>
        /* General Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif; /* Default font for body */
        }

        /* Background */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            /*height: 100vh; */
            background: linear-gradient(135deg, #e0c3fc, #ffb6b9, #8ec5fc); /* Blended gradient for background */
            flex-direction: column;
            text-align: center;
            color: #333;
            position: relative; /* For footer positioning */
            padding-bottom: 40px; /* To give space for the footer */
            padding: 40px;
        }

    

        /* Heading for Title */
        h1 {
            font-size: 2.5em;
            font-family: 'Poppins', sans-serif;
            color: #fff;
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* Heading for Subsections */
        h3 {
            font-size: 1.5em;
            font-family: 'Poppins', sans-serif;
            color: #fff;
            margin-top: 30px;
            font-weight: bold;
        }

        /* Extracted Data List */
        ul {
            list-style-type: none;
            margin-top: 20px;
            padding: 0;
        }

        li {
            font-size: 1.2em;
            margin: 10px 0;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 12px 20px;
            border-radius: 12px;
            color: #333;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        li strong {
            font-weight: bold;
            color: #ff6a88;
        }

        /* Paragraph for Summary */
        p {
            font-size: 1.2em;
            margin-top: 20px;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 20px;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            color: #333;
            line-height: 1.6;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Back to Upload Link */
        a {
            font-size: 1.2em;
            color: #ff6a88;
            text-decoration: none;
            font-family: 'Poppins', sans-serif;
            margin-top: 30px;
            display: inline-block;
            padding: 12px 30px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 25px;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        a:hover {
            background-color: #ff9a8b;
            transform: scale(1.05);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            h3 {
                font-size: 1.3em;
                margin-top: 0.3em;
            }

            li, p {
                font-size: 1em;
            }

            a {
                font-size: 1em;
                padding: 10px 25px;
            }
        }
    </style>
</head>
<body>

    <h1>Summary of the PDF</h1>

    <h3>Extracted Data:</h3>
    <ul>
        {% for key, value in extracted_data.items() %}
            <li><strong>{{ key }}</strong> {{ value }}</li>
        {% endfor %}
    </ul>

    <h3>Summary:</h3>
    <p>{{ summary }}</p>

    <a href="/">Back to Upload</a>

</body>
</html>
